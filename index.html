<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vui Học YCT1</title>
<meta name="description" content="Ôn tập Nghe – Nói – Đọc – Viết và từ vựng 12 bài YCT1 (Chuẩn Confucius Institute) cho bé, kèm bài kiểm tra tổng hợp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF7EC;
    --surface:#FFFFFF;
    --surface-2:#FFF1DC;
    --ink:#2B2440;
    --ink-soft:#6B6280;
    --line:#F0DFC4;
    --coral:#F2542D;
    --coral-ink:#B8331A;
    --coral-soft:#FFE4D8;
    --jade:#0F9B8E;
    --jade-ink:#08655C;
    --jade-soft:#DCF4EF;
    --gold:#FFB833;
    --gold-ink:#8A5A00;
    --gold-soft:#FFF0CE;
    --violet:#6C5CE7;
    --violet-soft:#E8E4FD;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow:0 10px 28px -14px rgba(43,36,64,.28);
    --shadow-sm:0 4px 12px -6px rgba(43,36,64,.22);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161327;
      --surface:#201D38;
      --surface-2:#2A2545;
      --ink:#F3EEFF;
      --ink-soft:#B7ADD6;
      --line:#372F55;
      --coral:#FF7A52;
      --coral-ink:#FFB49B;
      --coral-soft:#3B2436;
      --jade:#3FCBBB;
      --jade-ink:#9CEFE4;
      --jade-soft:#173733;
      --gold:#FFC94D;
      --gold-ink:#FFD98A;
      --gold-soft:#3A2E12;
      --violet:#A79BFF;
      --violet-soft:#2A2450;
      --shadow:0 10px 28px -14px rgba(0,0,0,.55);
      --shadow-sm:0 4px 12px -6px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161327;
    --surface:#201D38;
    --surface-2:#2A2545;
    --ink:#F3EEFF;
    --ink-soft:#B7ADD6;
    --line:#372F55;
    --coral:#FF7A52;
    --coral-ink:#FFB49B;
    --coral-soft:#3B2436;
    --jade:#3FCBBB;
    --jade-ink:#9CEFE4;
    --jade-soft:#173733;
    --gold:#FFC94D;
    --gold-ink:#FFD98A;
    --gold-soft:#3A2E12;
    --violet:#A79BFF;
    --violet-soft:#2A2450;
    --shadow:0 10px 28px -14px rgba(0,0,0,.55);
    --shadow-sm:0 4px 12px -6px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    padding-inline:16px;
    padding-block:0 28px;
  }
  .zh{font-family:'Noto Sans SC','Nunito',sans-serif}
  h1,h2,h3,.display{font-family:'Baloo 2','Nunito',sans-serif}
  h1,h2,h3{text-wrap:balance;margin:0}
  .wrap{max-width:980px;margin-inline:auto}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--gold-soft)}

  /* header */
  header.top{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
    background:var(--bg);
    padding-top:16px;
    margin-inline:-16px;padding-inline:16px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;padding-bottom:12px}
  .brand-badge{
    width:46px;height:46px;border-radius:14px;flex:none;
    background:linear-gradient(145deg,var(--coral),var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-size:22px;box-shadow:var(--shadow-sm);
  }
  .brand h1{font-size:20px;color:var(--ink);line-height:1.1}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);font-weight:700}
  .theme-btn{
    margin-left:auto;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  nav.tabs{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{
    flex:none;border:none;background:transparent;color:var(--ink-soft);
    font-weight:800;font-size:13.5px;padding:8px 14px;border-radius:999px;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  nav.tabs button.active{background:var(--ink);color:var(--bg)}
  nav.tabs button:not(.active):hover{background:var(--surface-2)}

  main{max-width:980px;margin-inline:auto;padding-top:20px}
  section.panel{display:none}
  section.panel.active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* home */
  .hero{
    background:linear-gradient(135deg,var(--coral) 0%,#FF8A57 60%,var(--gold) 130%);
    border-radius:var(--radius-lg);padding:26px 22px;color:#fff;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .hero::after{
    content:"你好 谢谢 再见 家";font-family:'Noto Sans SC';position:absolute;right:-10px;bottom:-18px;
    font-size:64px;font-weight:900;color:rgba(255,255,255,.14);white-space:nowrap;pointer-events:none;
  }
  .hero h2{font-size:26px;max-width:420px;position:relative}
  .hero p{margin:10px 0 16px;font-weight:700;opacity:.95;max-width:440px;font-size:14.5px;position:relative}
  .hero-stats{display:flex;gap:10px;flex-wrap:wrap;position:relative}
  .hero-stat{background:rgba(255,255,255,.18);backdrop-filter:blur(2px);border-radius:14px;padding:8px 14px;font-weight:800;font-size:13px}
  .hero-stat b{font-family:'Baloo 2';font-size:16px;display:block}

  .section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
  .section-title h3{font-size:18px}
  .section-title span{color:var(--ink-soft);font-size:12.5px;font-weight:700}

  .lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .lesson-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:14px;text-align:left;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;
  }
  .lesson-card .no{
    width:26px;height:26px;border-radius:9px;background:var(--jade-soft);color:var(--jade-ink);
    font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;
  }
  .lesson-card .zh{font-size:17px;font-weight:700}
  .lesson-card .py{font-size:11.5px;color:var(--ink-soft);font-weight:700}
  .lesson-card .vi{font-size:12px;color:var(--ink-soft);margin-top:2px}

  .skill-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
  .skill-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;
  }
  .skill-card .ic{font-size:22px}
  .skill-card b{font-size:14.5px}
  .skill-card span{font-size:12px;color:var(--ink-soft);font-weight:700}

  /* chip picker */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-ms-overflow-style:none;scrollbar-width:none}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
    font-weight:800;font-size:12.5px;padding:8px 13px;border-radius:999px;white-space:nowrap;
  }
  .chip.active{background:var(--coral);border-color:var(--coral);color:#fff}

  .lesson-head{
    background:var(--surface-2);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:14px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .lesson-head .zh{font-size:21px;font-weight:700}
  .lesson-head .py{font-size:12.5px;color:var(--ink-soft);font-weight:700}
  .lesson-head .vi{font-size:13px;font-weight:700;color:var(--coral-ink);margin-left:auto}

  /* flashcards */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
  .flashcard{perspective:1000px;height:190px}
  .flashcard-inner{
    position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;border-radius:var(--radius-md);
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
  .fc-face{
    position:absolute;inset:0;border-radius:var(--radius-md);backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:10px;box-shadow:var(--shadow-sm);border:1px solid var(--line);
  }
  .fc-front{background:var(--surface)}
  .fc-front .zh{font-size:46px;font-weight:700;line-height:1.15}
  .fc-front .py{font-size:14.5px;color:var(--ink-soft);font-weight:700;margin-top:8px}
  .fc-back{background:var(--jade-soft);transform:rotateY(180deg);color:var(--jade-ink)}
  .fc-back .vi{font-size:19px;font-weight:800}
  .fc-back .ex{font-size:15px;margin-top:8px;font-weight:700;opacity:.85}
  .fc-learned{outline:3px solid var(--gold);outline-offset:2px}
  .fc-speak{
    position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:9px;border:none;
    background:var(--coral-soft);color:var(--coral-ink);font-size:12px;z-index:2;
  }
  .fc-check{position:absolute;top:6px;left:6px;font-size:15px;z-index:2}
  .fc-hint{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:8px;font-weight:700}

  /* buttons */
  .btn{
    border:none;border-radius:999px;padding:11px 20px;font-weight:800;font-size:14px;
    display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm);
  }
  .btn-coral{background:var(--coral);color:#fff}
  .btn-jade{background:var(--jade);color:#fff}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
  .btn-gold{background:var(--gold);color:var(--gold-ink)}
  .btn[disabled]{opacity:.5}
  .btn-sm{padding:7px 14px;font-size:12.5px}

  /* generic exercise card */
  .ex-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px;
  }
  .ex-num{font-size:11.5px;font-weight:800;color:var(--violet);background:var(--violet-soft);
    display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:8px}
  .ex-zh{font-size:20px;font-weight:700}
  .ex-py{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin-top:2px}
  .options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
  .opt{
    border:1.5px solid var(--line);background:var(--surface-2);border-radius:var(--radius-sm);
    padding:10px 12px;font-weight:800;font-size:13.5px;text-align:left;
  }
  .opt.correct{background:var(--jade-soft);border-color:var(--jade);color:var(--jade-ink)}
  .opt.wrong{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink)}
  .opt.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
  .opt[disabled]{opacity:.75}
  .feedback{margin-top:10px;font-weight:800;font-size:13px}
  .feedback.ok{color:var(--jade-ink)}
  .feedback.no{color:var(--coral-ink)}

  .speak-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .speak-line .txt{flex:1;min-width:180px}
  .mini-story{border-left:4px solid var(--jade);padding-left:12px;margin:10px 0}
  .mini-story .row{margin-bottom:10px}
  .mini-story .who{font-size:11px;font-weight:800;color:var(--jade-ink);text-transform:uppercase;letter-spacing:.03em}

  .fill-blank{background:var(--surface-2);border:none;border-bottom:3px solid var(--coral);
    font-family:'Noto Sans SC';font-size:16px;font-weight:700;width:90px;text-align:center;
    border-radius:8px 8px 0 0;padding:4px 2px;color:var(--ink)}
  .fill-blank.correct{border-color:var(--jade);background:var(--jade-soft)}
  .fill-blank.wrong{border-color:var(--coral);background:var(--coral-soft)}

  .word-bank{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .word-chip{
    border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;
    font-family:'Noto Sans SC';font-weight:700;font-size:15px;
  }
  .word-chip.used{opacity:.35}
  .build-slot{
    min-height:46px;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;
    gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface-2);margin-top:8px
  }

  progress.bar{width:100%;height:10px;border-radius:999px;overflow:hidden;border:none;margin-top:4px}
  progress.bar::-webkit-progress-bar{background:var(--surface-2);border-radius:999px}
  progress.bar::-webkit-progress-value{background:var(--coral);border-radius:999px}
  progress.bar::-moz-progress-bar{background:var(--coral);border-radius:999px}

  .tracer-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:14px;box-shadow:var(--shadow-sm)}
  canvas#tracer{width:100%;touch-action:none;background:var(--surface-2);border-radius:var(--radius-sm);
    border:1px dashed var(--line)}
  .tracer-controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

  .test-hero{background:var(--violet-soft);border-radius:var(--radius-lg);padding:22px;text-align:center}
  .test-score{font-family:'Baloo 2';font-size:44px;color:var(--coral)}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;
    font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:200;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer.note{max-width:980px;margin:34px auto 0;font-size:11.5px;color:var(--ink-soft);text-align:center;font-weight:700}

  @media (max-width:520px){
    .hero h2{font-size:21px}
    .hero::after{font-size:44px}
    .lesson-head .vi{margin-left:0}
  }
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="brand-badge">🐼</div>
      <div>
        <h1>Vui Học YCT1</h1>
        <p>标准教程 1 · Ôn tập 12 bài cùng bé</p>
      </div>
      <button class="theme-btn" id="themeBtn" title="Đổi giao diện sáng/tối">🌙</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="home" class="active">🏠 Trang chủ</button>
      <button data-tab="vocab">🀄 Từ vựng</button>
      <button data-tab="listen">👂 Nghe</button>
      <button data-tab="speak">🗣️ Nói</button>
      <button data-tab="read">📖 Đọc</button>
      <button data-tab="write">✍️ Viết</button>
      <button data-tab="test">🏆 Kiểm tra</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel active" id="panel-home"></section>
  <section class="panel" id="panel-vocab"></section>
  <section class="panel" id="panel-listen"></section>
  <section class="panel" id="panel-speak"></section>
  <section class="panel" id="panel-read"></section>
  <section class="panel" id="panel-write"></section>
  <section class="panel" id="panel-test"></section>
</main>

<footer class="note">Biên soạn theo giáo trình YCT1 标准教程 (Hanban / Confucius Institute Headquarters) · Dành cho bé ôn tập trước khi học YCT1 quyển 2 🎈</footer>

<div class="toast" id="toast"></div>

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(arr,n,excludeFn){const pool=excludeFn?arr.filter(excludeFn):arr.slice();return shuffle(pool).slice(0,n);}
let toastTimer=null;
function toast(msg){
  const t=$('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)){ toast('Thiết bị chưa hỗ trợ phát âm 🔈'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'zh-CN';
    u.rate = 0.82;
    window.speechSynthesis.speak(u);
  }catch(e){ /* no-op: speech synthesis unavailable */ }
}
function speakSeq(items, lang, gap){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    (items||[]).forEach((txt,i)=>{
      const u=new SpeechSynthesisUtterance(txt);
      u.lang=lang||'zh-CN'; u.rate=0.82;
      window.speechSynthesis.speak(u);
    });
  }catch(e){}
}
function ls_get(key, fallback){
  try{ const v = localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; }
}
function ls_set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function wordId(lessonNo, zh){ return 'L'+lessonNo+'_'+zh; }
function isLearned(id){ const m = ls_get('yct1_learned', {}); return !!m[id]; }
function toggleLearned(id){ const m = ls_get('yct1_learned', {}); m[id]=!m[id]; ls_set('yct1_learned', m); return m[id]; }
function learnedCountFor(lesson){
  const m = ls_get('yct1_learned', {});
  return lesson.vocab.filter(v=>m[wordId(lesson.no, v.zh)]).length;
}

function fireConfetti(){
  try{
    const c = document.createElement('canvas');
    c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:300';
    c.width=innerWidth; c.height=innerHeight;
    document.body.appendChild(c);
    const ctx=c.getContext('2d');
    const colors=['#F2542D','#FFB833','#0F9B8E','#6C5CE7','#FF8A57'];
    const parts=Array.from({length:70},()=>({
      x:innerWidth/2,y:innerHeight/3,
      vx:(Math.random()-0.5)*14,vy:Math.random()*-10-4,
      g:0.35,r:3+Math.random()*4,c:colors[Math.floor(Math.random()*colors.length)],
      life:60+Math.random()*30
    }));
    let f=0;
    function step(){
      f++; ctx.clearRect(0,0,c.width,c.height);
      let alive=false;
      parts.forEach(p=>{
        if(p.life<=0) return; alive=true;
        p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life--;
        ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(p.life/90,0);
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      });
      ctx.globalAlpha=1;
      if(alive && f<140) requestAnimationFrame(step); else c.remove();
    }
    step();
  }catch(e){}
}

const TAB_NAMES = {home:'home',vocab:'vocab',listen:'listen',speak:'speak',read:'read',write:'write',test:'test'};
function showTab(name){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));

  window.scrollTo({top:0,behavior:'smooth'});
}

});
$('themeBtn').addEventListener('click', ()=>{
  const root=document.documentElement;
  const cur=root.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : (cur==='light' ? null : 'dark');
  if(next) root.setAttribute('data-theme',next); else root.removeAttribute('data-theme');
  $('themeBtn').textContent = next==='dark' ? '☀️' : '🌙';
});

/* ---------- LISTEN ---------- */
function viMeaning(v){ return v.vi.split(',')[0].split('(')[0].trim(); }
function renderListen(){
  const lesson = LESSONS.find(l=>l.no===selLesson.listen);
  const allVocab = LESSONS.flatMap(l=>l.vocab);
  let html = `
    <div class="section-title"><h3>👂 Luyện nghe</h3><span>nghe rồi chọn nghĩa đúng</span></div>
    ${chipRow('listen')}
    ${lessonHead(lesson)}
    <button class="btn btn-jade" id="playDialog">🔊 Nghe cả bài hội thoại</button>
    <div class="section-title"><h3>Nghe từ vựng</h3><span>${lesson.vocab.length} từ</span></div>
  `;
  lesson.vocab.forEach((v,i)=>{
    const distract = pick(allVocab, 3, x=>x.zh!==v.zh).map(viMeaning);
    const opts = shuffle([viMeaning(v), ...distract]);
    html += `<div class="ex-card" data-kind="word" data-answer="${esc(viMeaning(v))}">
      <span class="ex-num">Câu ${i+1}</span>
      <div class="speak-line">
        <button class="btn btn-coral btn-sm" data-speak="${esc(v.zh)}">🔊 Nghe</button>
        <span class="txt" style="font-weight:700;color:var(--ink-soft);font-size:12.5px">Đây là từ gì?</span>
      </div>
      <div class="options">${opts.map(o=>`<button class="opt" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="feedback"></div>
    </div>`;
  });
  html += `<div class="section-title"><h3>Nghe câu chính</h3><span>${lesson.sentences.length} câu</span></div>`;
  const allSentences = LESSONS.flatMap(l=>l.sentences);
  lesson.sentences.forEach((s,i)=>{
    const distract = pick(allSentences, 3, x=>x.vi!==s.vi).map(x=>x.vi);
    const opts = shuffle([s.vi, ...distract]);
    html += `<div class="ex-card" data-kind="sentence" data-answer="${esc(s.vi)}">
      <span class="ex-num">Câu ${i+1}</span>
      <div class="speak-line">
        <button class="btn btn-coral btn-sm" data-speak="${esc(s.zh)}">🔊 Nghe</button>
        <span class="txt" style="font-weight:700;color:var(--ink-soft);font-size:12.5px">Câu này nghĩa là gì?</span>
      </div>
      <div class="options">${opts.map(o=>`<button class="opt" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="feedback"></div>
    </div>`;
  });
  $('panel-listen').innerHTML = html;
  bindChips('listen', renderListen);
  $('playDialog').addEventListener('click', ()=> speakSeq(lesson.dialogue.map(d=>d.zh)));
  wireQuizCards($('panel-listen'));
  $('panel-listen').querySelectorAll('[data-speak]').forEach(btn=>{
    btn.addEventListener('click', ()=> speak(btn.dataset.speak));
  });
}
function wireQuizCards(root){
  root.querySelectorAll('.ex-card[data-answer]').forEach(card=>{
    const answer = card.dataset.answer;
    card.querySelectorAll('.opt').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        const fb = card.querySelector('.feedback');
        const ok = opt.dataset.val===answer;
        card.querySelectorAll('.opt').forEach(o=>{
          o.disabled=true;
          if(o.dataset.val===answer) o.classList.add('correct');
          else if(o===opt) o.classList.add('wrong');
        });
        if(fb){ fb.textContent = ok? '✅ Chính xác! Giỏi quá!' : '❌ Chưa đúng, đáp án đúng là: '+answer;
          fb.className='feedback '+(ok?'ok':'no'); }
        if(ok) toast('✅ Chính xác!');
      });
    });
  });
}

/* ---------- READ ---------- */
function renderRead(){
  const lesson = LESSONS.find(l=>l.no===selLesson.read);
  let html = `
    <div class="section-title"><h3>📖 Luyện đọc</h3><span>đọc hội thoại & trả lời</span></div>
    ${chipRow('read')}
    ${lessonHead(lesson)}
    <div class="ex-card">
      <span class="ex-num">Hội thoại / bài đọc</span>
      <div class="mini-story">
        ${lesson.dialogue.map(d=>`<div class="row"><div class="who">${esc(d.who)}</div>
          <div class="zh" style="font-size:17px;font-weight:700">${esc(d.zh)}</div>
          <div class="py">${esc(d.py)}</div>
          <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px">${esc(d.vi)}</div></div>`).join('')}
      </div>
    </div>
    <div class="section-title"><h3>Đọc hiểu — Đúng hay Sai?</h3><span>đọc câu tiếng Trung, xét nghĩa bên dưới</span></div>
  `;
  const pool = [...lesson.sentences, ...lesson.dialogue.map(d=>({zh:d.zh,vi:d.vi}))];
  const globalPool = LESSONS.flatMap(l=>l.sentences);
  const picks = shuffle(pool).slice(0,4);
  picks.forEach((p,i)=>{
    const makeFalse = Math.random()<0.5;
    let shownVi = p.vi, isTrue = true;
    if(makeFalse){
      const alt = pick(globalPool,1,x=>x.vi!==p.vi)[0];
      if(alt){ shownVi = alt.vi; isTrue=false; }
    }
    html += `<div class="ex-card" data-tf="${isTrue}">
      <span class="ex-num">Câu ${i+1}</span>
      <div class="ex-zh">${esc(p.zh)}</div>
      <div class="ex-py" style="margin-bottom:8px">Nghĩa là: "${esc(shownVi)}" — đúng không?</div>
      <div class="options">
        <button class="opt" data-val="true">✅ Đúng</button>
        <button class="opt" data-val="false">❌ Sai</button>
      </div>
      <div class="feedback"></div>
    </div>`;
  });
  html += `<div class="section-title"><h3>Nối chữ Hán với Pinyin</h3><span>chạm 1 chữ Hán rồi chạm Pinyin tương ứng</span></div>
    <div class="ex-card"><div id="matchGame"></div></div>`;
  $('panel-read').innerHTML = html;
  bindChips('read', renderRead);

  $('panel-read').querySelectorAll('.ex-card[data-tf]').forEach(card=>{
    const isTrue = card.dataset.tf==='true';
    card.querySelectorAll('.opt').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        const fb=card.querySelector('.feedback');
        const chosenTrue = opt.dataset.val==='true';
        const ok = chosenTrue===isTrue;
        card.querySelectorAll('.opt').forEach(o=>{
          o.disabled=true;
          const oTrue=o.dataset.val==='true';
          if(oTrue===isTrue) o.classList.add('correct'); else if(o===opt) o.classList.add('wrong');
        });
        fb.textContent = ok?'✅ Chính xác!':('❌ Chưa đúng — câu này thật ra là "'+(isTrue?'Đúng':'Sai')+'"');
        fb.className='feedback '+(ok?'ok':'no');
        if(ok) toast('✅ Đọc hiểu tốt lắm!');
      });
    });
  });

  const mv = shuffle(lesson.vocab.slice(0, Math.min(6, lesson.vocab.length)));
  const mg = $('matchGame');
  let selZh=null, selPy=null, matched=new Set();
  function drawMatch(){
    const zhList = mv;
    const pyList = shuffle(mv);
    mg.innerHTML = `<div style="display:flex;gap:24px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:8px">${zhList.map(v=>`<button class="word-chip" data-m="zh" data-w="${esc(v.zh)}" style="min-width:70px">${esc(v.zh)}</button>`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${pyList.map(v=>`<button class="word-chip" data-m="py" data-w="${esc(v.zh)}" style="min-width:100px">${esc(v.py)}</button>`).join('')}</div>
    </div>`;
    mg.querySelectorAll('[data-m]').forEach(b=>{
      if(matched.has(b.dataset.w) && b.dataset.m==='zh') {}
      b.addEventListener('click', ()=>{
        if(matched.has(b.dataset.w)) return;
        if(b.dataset.m==='zh'){ selZh=b; }
        else { selPy=b; }
        b.style.outline='3px solid var(--gold)';
        if(selZh && selPy){
          if(selZh.dataset.w===selPy.dataset.w){
            selZh.style.background='var(--jade-soft)'; selPy.style.background='var(--jade-soft)';
            selZh.style.outline='none'; selPy.style.outline='none';
            selZh.disabled=true; selPy.disabled=true;
            matched.add(selZh.dataset.w);
            toast('✅ Nối đúng!');
            if(matched.size===mv.length){ toast('🎉 Xong! Bé nối đúng hết!'); fireConfetti(); }
          } else {
            selZh.style.background='var(--coral-soft)'; selPy.style.background='var(--coral-soft)';
            setTimeout(()=>{ if(selZh){selZh.style.background='';selZh.style.outline='none';} if(selPy){selPy.style.background='';selPy.style.outline='none';} },500);
          }
          selZh=null; selPy=null;
        }
      });
    });
  }
  drawMatch();
}

/* ---------- WRITE ---------- */
const TRACE_ITEMS = [
  {zh:'一',py:'yī'},{zh:'二',py:'èr'},{zh:'三',py:'sān'},{zh:'十',py:'shí'},
  {zh:'你',py:'nǐ'},{zh:'好',py:'hǎo'},{zh:'人',py:'rén'},{zh:'大',py:'dà'},
  {zh:'小',py:'xiǎo'},{zh:'我',py:'wǒ'},{zh:'爱',py:'ài'},{zh:'家',py:'jiā'}
];
function findBlankVocab(lesson, sentenceZh){
  const sorted = lesson.vocab.slice().sort((a,b)=>b.zh.length-a.zh.length);
  return sorted.find(v=>sentenceZh.indexOf(v.zh)!==-1);
}
function renderWrite(){
  const lesson = LESSONS.find(l=>l.no===selLesson.write);
  const allVocab = LESSONS.flatMap(l=>l.vocab);
  let html = `
    <div class="section-title"><h3>🎨 Bảng luyện viết</h3><span>kéo/chạm để tô theo nét mờ</span></div>
    <div class="tracer-wrap">
      <div class="chip-row" id="traceChips">
        ${TRACE_ITEMS.map((t,i)=>`<button class="chip ${i===0?'active':''}" data-trace="${i}">${t.zh}</button>`).join('')}
      </div>
      <canvas id="tracer" width="600" height="260"></canvas>
      <div class="tracer-controls">
        <button class="btn btn-ghost btn-sm" id="traceClear">🧹 Xóa</button>
        <button class="btn btn-coral btn-sm" id="traceSpeak">🔊 Nghe âm</button>
      </div>
    </div>

    <div class="section-title"><h3>✍️ Điền từ còn thiếu</h3><span>ôn theo bài</span></div>
    ${chipRow('write')}
    ${lessonHead(lesson)}
  `;
  const fillPool = lesson.sentences;
  fillPool.forEach((s,i)=>{
    const target = findBlankVocab(lesson, s.zh);
    if(!target) return;
    const blanked = s.zh.replace(target.zh, '＿');
    let distractPool = lesson.vocab.filter(v=>v.zh!==target.zh);
    if(distractPool.length<3) distractPool = allVocab.filter(v=>v.zh!==target.zh);
    const opts = shuffle([target.zh, ...pick(distractPool,3).map(v=>v.zh)]);
    html += `<div class="ex-card" data-answer="${esc(target.zh)}">
      <span class="ex-num">Câu ${i+1}</span>
      <div class="ex-zh">${esc(blanked)}</div>
      <div class="ex-py">${esc(s.vi)}</div>
      <div class="options">${opts.map(o=>`<button class="opt" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="feedback"></div>
    </div>`;
  });

  html += `<div class="section-title"><h3>🔤 Sắp xếp hội thoại</h3><span>chạm các câu theo đúng thứ tự</span></div>
    <div class="ex-card"><p style="font-size:12.5px;color:var(--ink-soft);font-weight:700;margin:0 0 8px">Chạm từng câu theo thứ tự đúng của hội thoại bài ${lesson.no}:</p>
    <div id="orderBank" class="word-bank"></div>
    <div id="orderSlot" class="build-slot"></div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn btn-jade btn-sm" id="orderCheck">Kiểm tra</button>
      <button class="btn btn-ghost btn-sm" id="orderReset">Làm lại</button>
    </div>
    <div class="feedback" id="orderFb"></div>
    </div>`;

  $('panel-write').innerHTML = html;
  bindChips('write', renderWrite);
  wireQuizCards($('panel-write'));

  /* ordering game */
  const lines = lesson.dialogue;
  let bankState = shuffle(lines.map((d,i)=>i));
  let slotState = [];
  function drawOrder(){
    $('orderBank').innerHTML = bankState.map(i=>`<button class="word-chip" data-i="${i}" style="font-family:'Nunito';font-size:12.5px;max-width:220px;text-align:left">${esc(lines[i].vi)}</button>`).join('');
    $('orderSlot').innerHTML = slotState.length? slotState.map((i,pos)=>`<button class="word-chip" data-slot="${pos}" style="font-family:'Nunito';font-size:12.5px;background:var(--jade-soft)">${pos+1}. ${esc(lines[i].vi)}</button>`).join('') : '<span style="font-size:12px;color:var(--ink-soft);font-weight:700">Câu bé chọn sẽ xếp vào đây…</span>';
    $('orderBank').querySelectorAll('[data-i]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const idx=Number(b.dataset.i);
        bankState = bankState.filter(x=>x!==idx);
        slotState.push(idx);
        drawOrder();
      });
    });
    $('orderSlot').querySelectorAll('[data-slot]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const pos=Number(b.dataset.slot);
        const idx=slotState[pos];
        slotState.splice(pos,1);
        bankState.push(idx);
        drawOrder();
      });
    });
  }
  drawOrder();
  $('orderCheck').addEventListener('click', ()=>{
    const fb=$('orderFb');
    const correct = slotState.length===lines.length && slotState.every((v,i)=>v===i);
    fb.textContent = correct? '🎉 Chính xác! Bé sắp xếp đúng thứ tự hội thoại!' : '❌ Chưa đúng thứ tự, thử sắp xếp lại nhé!';
    fb.className = 'feedback '+(correct?'ok':'no');
    if(correct) fireConfetti();
  });
  $('orderReset').addEventListener('click', ()=>{ bankState=shuffle(lines.map((d,i)=>i)); slotState=[]; drawOrder(); $('orderFb').textContent=''; });

  /* tracer */
  let traceIdx=0;
  const canvas=$('tracer'); const ctx=canvas.getContext('2d');
  function drawGuide(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft') || '#999';
    ctx.globalAlpha=0.28;
    ctx.font = "180px 'Noto Sans SC'";
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(TRACE_ITEMS[traceIdx].zh, canvas.width/2, canvas.height/2+10);
    ctx.globalAlpha=1;
  }
  drawGuide();
  let drawing=false, last=null;
  function pos(e){
    const r=canvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
    return {x: cx*(canvas.width/r.width), y: cy*(canvas.height/r.height)};
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p=pos(e);
    ctx.strokeStyle='#F2542D'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; e.preventDefault();
  }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
  $('traceClear').addEventListener('click', drawGuide);
  $('traceSpeak').addEventListener('click', ()=> speak(TRACE_ITEMS[traceIdx].zh));
  $('traceChips').querySelectorAll('[data-trace]').forEach(b=>{
    b.addEventListener('click', ()=>{
      traceIdx=Number(b.dataset.trace);
      $('traceChips').querySelectorAll('[data-trace]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      drawGuide();
    });
  });
}

/* ---------- TEST ---------- */
let testState = null;
function buildTest(){
  const allVocab = LESSONS.flatMap(l=>l.vocab.map(v=>({...v, lessonNo:l.no})));
  const allSentences = LESSONS.flatMap(l=>l.sentences);
  const listen = shuffle(allVocab).slice(0,10).map(v=>{
    const distract = pick(allVocab,3,x=>x.zh!==v.zh).map(viMeaning);
    return {type:'listen', zh:v.zh, answer:viMeaning(v), options:shuffle([viMeaning(v),...distract])};
  });
  const read = shuffle(allSentences).slice(0,8).map(s=>{
    const isTrue = Math.random()<0.5;
    let shownVi=s.vi;
    if(!isTrue){ const alt=pick(allSentences,1,x=>x.vi!==s.vi)[0]; if(alt) shownVi=alt.vi; }
    return {type:'read', zh:s.zh, shownVi, isTrue: shownVi===s.vi};
  });
  const write = shuffle(LESSONS.filter(l=>l.sentences.length)).slice(0,8).map(l=>{
    const s = l.sentences[Math.floor(Math.random()*l.sentences.length)];
    const target = findBlankVocab(l,s.zh);
    if(!target) return null;
    const blanked = s.zh.replace(target.zh,'＿');
    let distractPool = l.vocab.filter(v=>v.zh!==target.zh);
    if(distractPool.length<3) distractPool = allVocab.filter(v=>v.zh!==target.zh);
    return {type:'write', zh:blanked, vi:s.vi, answer:target.zh, options:shuffle([target.zh,...pick(distractPool,3).map(v=>v.zh)])};
  }).filter(Boolean);
  const speakItems = shuffle(allSentences).slice(0,6);
  return {listen, read, write, speakItems, answers:{}, spokenChecked:{}, submitted:false};
}
function renderTest(){
  if(!testState || !$('panel-test').dataset.built){
    $('panel-test').innerHTML = `
      <div class="test-hero">
        <div style="font-size:44px">🏆</div>
        <h2>Bài kiểm tra tổng hợp YCT1</h2>
        <p style="font-weight:700;color:var(--ink-soft);max-width:440px;margin:10px auto 18px">
          Bài kiểm tra gồm 4 phần: Nghe (10 câu) · Đọc (8 câu) · Viết (8 câu) · Nói (6 câu tự luyện),
          tổng hợp kiến thức toàn bộ 12 bài trong quyển YCT1.
        </p>
        <button class="btn btn-coral" id="startTest">🚀 Bắt đầu làm bài</button>
      </div>`;
    $('startTest').addEventListener('click', ()=>{
      testState = buildTest();
      $('panel-test').dataset.built='1';
      drawTest();
    });
    return;
  }
  drawTest();
}
function drawTest(){
  const t = testState;
  let html = `<div class="section-title"><h3>👂 Phần Nghe</h3><span>chọn nghĩa đúng</span></div>`;
  t.listen.forEach((it,i)=>{
    const chosen = t.answers['L'+i];
    html += `<div class="ex-card">
      <span class="ex-num">Câu ${i+1}</span>
      <button class="btn btn-coral btn-sm" data-speak="${esc(it.zh)}">🔊 Nghe</button>
      <div class="options" style="margin-top:10px">
        ${it.options.map(o=>`<button class="opt test-opt ${t.submitted?(o===it.answer?'correct':(o===chosen?'wrong':'')):(o===chosen?'active':'')}" data-group="L${i}" data-val="${esc(o)}" ${t.submitted?'disabled':''}>${esc(o)}</button>`).join('')}
      </div>
    </div>`;
  });
  html += `<div class="section-title"><h3>📖 Phần Đọc</h3><span>đúng hay sai</span></div>`;
  t.read.forEach((it,i)=>{
    const chosen = t.answers['R'+i];
    html += `<div class="ex-card">
      <span class="ex-num">Câu ${i+1}</span>
      <div class="ex-zh">${esc(it.zh)}</div>
      <div class="ex-py" style="margin-bottom:8px">Nghĩa là: "${esc(it.shownVi)}" — đúng không?</div>
      <div class="options">
        <button class="opt test-opt ${t.submitted? (it.isTrue===true? 'correct':(chosen==='true'?'wrong':'')) : (chosen==='true'?'active':'')}" data-group="R${i}" data-val="true" ${t.submitted?'disabled':''}>✅ Đúng</button>
        <button class="opt test-opt ${t.submitted? (it.isTrue===false? 'correct':(chosen==='false'?'wrong':'')) : (chosen==='false'?'active':'')}" data-group="R${i}" data-val="false" ${t.submitted?'disabled':''}>❌ Sai</button>
      </div>
    </div>`;
  });
  html += `<div class="section-title"><h3>✍️ Phần Viết</h3><span>chọn từ điền vào chỗ trống</span></div>`;
  t.write.forEach((it,i)=>{
    const chosen = t.answers['W'+i];
    html += `<div class="ex-card">
      <span class="ex-num">Câu ${i+1}</span>
      <div class="ex-zh">${esc(it.zh)}</div>
      <div class="ex-py">${esc(it.vi)}</div>
      <div class="options">
        ${it.options.map(o=>`<button class="opt test-opt ${t.submitted?(o===it.answer?'correct':(o===chosen?'wrong':'')):(o===chosen?'active':'')}" data-group="W${i}" data-val="${esc(o)}" ${t.submitted?'disabled':''}>${esc(o)}</button>`).join('')}
      </div>
    </div>`;
  });
  html += `<div class="section-title"><h3>🗣️ Phần Nói</h3><span>đọc to từng câu, tự đánh giá</span></div>`;
  t.speakItems.forEach((s,i)=>{
    const checked = !!t.spokenChecked[i];
    html += `<div class="ex-card">
      <span class="ex-num">Câu ${i+1}</span>
      <div class="ex-zh">${esc(s.zh)}</div>
      <div class="ex-py">${esc(s.py)} · ${esc(s.vi)}</div>
      <div class="speak-line" style="margin-top:8px">
        <button class="btn btn-ghost btn-sm" data-speak="${esc(s.zh)}">🔊 Nghe mẫu</button>
        <label style="display:flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;color:var(--jade-ink)">
          <input type="checkbox" data-spoke="${i}" ${checked?'checked':''} ${t.submitted?'disabled':''}/> Con đã đọc to câu này
        </label>
      </div>
    </div>`;
  });

  if(!t.submitted){
    html += `<button class="btn btn-gold" id="submitTest" style="width:100%;justify-content:center;font-size:16px;padding:14px">✅ Nộp bài</button>`;
  } else {
    const correctListen = t.listen.filter((it,i)=>t.answers['L'+i]===it.answer).length;
    const correctRead = t.read.filter((it,i)=> (t.answers['R'+i]==='true')===it.isTrue ).length;
    const correctWrite = t.write.filter((it,i)=>t.answers['W'+i]===it.answer).length;
    const spokenN = Object.values(t.spokenChecked).filter(Boolean).length;
    const total = t.listen.length+t.read.length+t.write.length;
    const correct = correctListen+correctRead+correctWrite;
    const pct = Math.round(correct/total*100);
    const stars = pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'💪';
    html = `<div class="test-hero">
      <div class="test-score">${correct}/${total}</div>
      <p style="font-weight:800;font-size:18px;margin:4px 0">${stars} ${pct}% chính xác</p>
      <p style="font-weight:700;color:var(--ink-soft)">Nghe: ${correctListen}/${t.listen.length} · Đọc: ${correctRead}/${t.read.length} · Viết: ${correctWrite}/${t.write.length} · Nói: ${spokenN}/${t.speakItems.length} câu đã luyện</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-coral" id="redoTest">🔁 Làm lại bài khác</button>
        <button class="btn btn-ghost" id="reviewTest">🔍 Xem lại đáp án bên dưới</button>
      </div>
    </div>` + html;
  }

  $('panel-test').innerHTML = html;
  $('panel-test').querySelectorAll('[data-speak]').forEach(b=> b.addEventListener('click', ()=>speak(b.dataset.speak)));
  if(!testState.submitted){
    $('panel-test').querySelectorAll('.test-opt').forEach(b=>{
      b.addEventListener('click', ()=>{
        testState.answers[b.dataset.group] = b.dataset.val;
        drawTest();
      });
    });
    $('panel-test').querySelectorAll('[data-spoke]').forEach(cb=>{
      cb.addEventListener('change', ()=>{ testState.spokenChecked[cb.dataset.spoke]=cb.checked; });
    });
    const submitBtn = $('submitTest');
    if(submitBtn) submitBtn.addEventListener('click', ()=>{ testState.submitted=true; drawTest(); fireConfetti(); });
  } else {
    const redo = $('redoTest'); if(redo) redo.addEventListener('click', ()=>{ testState=buildTest(); drawTest(); window.scrollTo({top:0,behavior:'smooth'}); });
    const rv = $('reviewTest'); if(rv) rv.addEventListener('click', ()=>{ window.scrollTo({top:400,behavior:'smooth'}); });
  }
}

/* ---------- init ---------- */
try{
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    $('themeBtn').textContent='☀️';
  }
}catch(e){}
renderHome();

</script>
